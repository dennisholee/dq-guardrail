$schema: https://json-schema.org/draft/2020-12/schema
$id: https://registry.internal/dq/schemas/value-set.schema.yaml
title: Value set
description: >-
  A governed enumeration. Value sets are referenced by $id from object contracts and
  from rules, never restated inline — invariant S2. Bundle-pinned value sets change
  only by release, which is correct for data that moves quarterly and unacceptable
  for data that moves hourly; fast-moving reference data belongs in a live provider.
type: object
additionalProperties: false
required: [apiVersion, kind, valueSet, version, owner, values]
properties:
  apiVersion: { const: dq/v1 }
  kind: { const: ValueSet }
  valueSet:
    type: string
    pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$'
    description: Referenced as https://registry.internal/dq/valuesets/<valueSet>
  version:
    type: string
    pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
  title: { type: string, maxLength: 120 }
  owner: { type: string, minLength: 2 }
  source:
    type: object
    additionalProperties: false
    required: [authority]
    properties:
      authority: { type: string, minLength: 2 }
      reference: { type: string }
  updatedOn: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
  caseSensitive: { type: boolean, default: false }
  values:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: { type: string, minLength: 1, maxLength: 64 }
        label: { type: string, maxLength: 200 }
        validFrom: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
        validTo: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}$' }
        deprecated: { type: boolean, default: false }
