$schema: https://json-schema.org/draft/2020-12/schema
$id: https://registry.internal/dq/schemas/quality-pack.schema.yaml
title: Quality pack
description: >-
  The authored rules for one object. Tier 0 is derived from the canonical schema and is
  never restated here; `syntax.extra` exists only for constraints JSON Schema cannot
  express. Stricter than the pack's printed fragment in one respect: `spec` and each
  rule are closed to unknown keys, because a typo in a rule key is a rule that silently
  does not run.
type: object
additionalProperties: false
required: [apiVersion, kind, metadata, spec]
properties:
  apiVersion: { const: dq/v1 }
  kind: { const: QualityPack }
  metadata:
    type: object
    additionalProperties: false
    required: [name, version, owner]
    properties:
      name: { type: string, pattern: '^object\.[a-z][a-z0-9]*$' }
      version:
        type: string
        pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
      owner: { type: string, minLength: 2 }
  spec:
    type: object
    additionalProperties: false
    required: [object, tests]
    properties:
      object:
        type: object
        additionalProperties: false
        required: [name, schemaVersion]
        properties:
          name: { type: string, pattern: '^[a-z][a-z0-9]*$' }
          schemaVersion:
            type: string
            pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
      requires:
        type: array
        uniqueItems: true
        items: { type: string, pattern: '^(valueset|refdata)\.[a-z][a-z0-9-]*$' }
      syntax:
        type: object
        additionalProperties: false
        required: [fromSchema]
        properties:
          fromSchema:
            type: object
            additionalProperties: false
            required: [ref]
            properties:
              ref: { type: string, minLength: 1 }
              assertFormat: { type: boolean, default: false }
          extra:
            type: array
            items: { $ref: '#/$defs/rule' }
      semantic: { type: array, items: { $ref: '#/$defs/rule' } }
      stateful: { type: array, items: { $ref: '#/$defs/rule' } }
      tests: { type: array, minItems: 1, items: { $ref: '#/$defs/fixture' } }
$defs:
  rule:
    type: object
    additionalProperties: false
    required: [id, assert, severity, dimension]
    properties:
      id: { type: string, pattern: '^(SYN|SEM|STA)-[A-Z]{3}-[0-9]{3}$' }
      when: { type: string, maxLength: 1000, description: 'CEL guard expression' }
      assert: { type: string, maxLength: 2000, description: 'CEL expression returning bool' }
      message: { type: string, maxLength: 200 }
      severity: { enum: [CRITICAL, MAJOR, MINOR] }
      dimension: { enum: [completeness, validity, accuracy, consistency, uniqueness, timeliness] }
      needs: { type: array, uniqueItems: true, items: { enum: [valueset, refdata, history, delta] } }
      costLimit: { type: integer, minimum: 100 }
      path: { type: string, pattern: '^\$(\.[A-Za-z_][A-Za-z0-9_]*|\[[0-9]+\])*$' }
      normalizer: { type: array, items: { enum: [trim, nfc, upper, lower] } }
      lifecycle: { enum: [active, retired], default: active }
      successor: { type: string, pattern: '^(SYN|SEM|STA)-[A-Z]{3}-[0-9]{3}$' }
    allOf:
      - if: { properties: { lifecycle: { const: retired } }, required: [lifecycle] }
        then: { required: [successor] }
  fixture:
    type: object
    additionalProperties: false
    required: [rule, expect, input]
    properties:
      rule: { type: string, pattern: '^(SYN|SEM|STA)-[A-Z]{3}-[0-9]{3}$' }
      expect: { enum: [pass, fail, edge] }
      input: { type: object }
      note: { type: string, maxLength: 300 }
  relax:
    type: object
    additionalProperties: false
    required: [rule, justification, approvedBy, expiresAt]
    properties:
      rule: { type: string, pattern: '^(SYN|SEM|STA)-[A-Z]{3}-[0-9]{3}$' }
      layer: { enum: [intent, channel, binding] }
      justification: { type: string, minLength: 20, maxLength: 500 }
      approvedBy: { type: array, minItems: 2, uniqueItems: true, items: { type: string } }
      expiresAt: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' }
