$schema: https://json-schema.org/draft/2020-12/schema
$id: https://registry.internal/dq/schemas/bundle-manifest.schema.yaml
title: Bundle manifest
description: >-
  bundle.yaml inside the published OCI artefact. Previously a version number with no
  format behind it. The manifest is the audit entry point: it names the commit the bundle
  was built from, every object, value set, registry and pack version it contains, the
  providers a rule may call, the relax blocks that were actually applied, and one digest per
  resolved plan. Determinism is a requirement, not a nicety: buildEpoch comes from
  SOURCE_DATE_EPOCH so identical inputs produce an identical bundle digest.
type: object
additionalProperties: false
required: [bundleFormat, builtFrom, objects, valueSets, packs, providers, plans]
properties:
  bundleFormat: { const: 2 }
  builtFrom:
    type: object
    additionalProperties: false
    required: [commit, epoch]
    properties:
      commit: { type: string, pattern: '^[a-f0-9]{40}$' }
      ref: { type: string }
      epoch: { type: integer, minimum: 0, description: SOURCE_DATE_EPOCH in seconds }
      dqctl: { type: string }
  objects:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [name, version, contractDigest]
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9]*$' }
        version: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' }
        contractDigest: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        criticality: { enum: [P1, P2, P3] }
        sensitivity: { enum: [PUBLIC, INTERNAL, CONFIDENTIAL, RESTRICTED] }
  valueSets:
    type: array
    description: >-
      The governed enumerations the rules are written against. Added in 1.3.0: before it, a
      bundle carried six value sets and the intent registry that its manifest said nothing
      about, so a consumer could see that some file had a value set's digest and could not see
      a claim that it was the one that had been reviewed.
    items:
      type: object
      additionalProperties: false
      required: [name, version, path, digest]
      properties:
        name: { type: string, pattern: '^[a-z][a-z0-9]*(-[a-z0-9]+)*$' }
        version: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' }
        path: { type: string, pattern: '^catalog/value-sets/[a-z0-9-]+\.yaml$' }
        digest: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
  intents:
    type: object
    description: The intent registry, carried by the bundle and described here since 1.3.0.
    additionalProperties: false
    required: [path, digest]
    properties:
      path: { type: string, pattern: '^catalog/intents\.yaml$' }
      digest: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
  packs:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [name, version, digest]
      properties:
        name: { type: string, pattern: '^(object|intent)\.[a-z][a-z0-9]*$' }
        version: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' }
        digest: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
        ruleCount: { type: integer, minimum: 0 }
  providers:
    type: array
    uniqueItems: true
    items: { enum: [valueset, refdata, history, delta] }
  relax:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [rule, approvedBy, expiresAt]
      properties:
        rule: { type: string, pattern: '^(SYN|SEM|STA)-[A-Z]{3}-[0-9]{3}$' }
        layer: { enum: [intent, channel, binding] }
        approvedBy: { type: array, minItems: 2, items: { type: string } }
        expiresAt: { type: string, pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}Z$' }
  plans:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [plan, channel, intent, object, objectVersion, digest]
      properties:
        plan: { type: string, pattern: '^plans/[a-z-]+\.[a-z][a-z0-9]*\.[a-z][a-z0-9]*\.plan\.json$' }
        channel: { enum: [http, kafka, file] }
        intent: { type: string, pattern: '^[a-z][a-z0-9]*$' }
        object: { type: string, pattern: '^[a-z][a-z0-9]*$' }
        objectVersion: { type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$' }
        digest: { type: string, pattern: '^sha256:[a-f0-9]{64}$' }
