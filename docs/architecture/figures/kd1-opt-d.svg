<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 250" width="740" height="250" role="img" aria-label="Option D: managed gateway policy">
  <defs>
    <marker id="mD" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#5B6B7F"/>
    </marker>
    <marker id="mDx" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <path d="M0,0 L9,3.5 L0,7 z" fill="#B42318"/>
    </marker>
  </defs>
  <rect width="740" height="250" fill="#F7F9FC"/>
  <text x="20" y="26" font-family="Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#101828">Option D — Managed gateway policy (central, front door only)</text>

  <rect x="20" y="104" width="92" height="52" rx="6" fill="#FFFFFF" stroke="#5B6B7F" stroke-width="1.5"/>
  <text x="66" y="134" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#1D2939">Client</text>

  <rect x="140" y="66" width="196" height="128" rx="8" fill="#FEF3F2" stroke="#B42318" stroke-width="1.8"/>
  <text x="238" y="86" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600" fill="#B42318">Central API gateway</text>
  <text x="238" y="104" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#B42318">vendor policy language</text>
  <text x="238" y="122" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#B42318">sees every payload</text>
  <text x="238" y="140" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#B42318">single config = global blast radius</text>
  <text x="238" y="162" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#B42318">2nd rule language</text>

  <rect x="376" y="60" width="130" height="44" rx="5" fill="#FFFFFF" stroke="#5B6B7F" stroke-width="1.2"/>
  <text x="441" y="87" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1D2939">HTTP svc A</text>

  <rect x="376" y="116" width="130" height="44" rx="5" fill="#FFFFFF" stroke="#5B6B7F" stroke-width="1.2"/>
  <text x="441" y="143" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1D2939">HTTP svc B</text>

  <rect x="376" y="172" width="130" height="44" rx="5" fill="#F2F4F7" stroke="#98A2B3" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="441" y="192" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#667085">Kafka / files / Jobs</text>
  <text x="441" y="207" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#B42318">uncovered</text>

  <rect x="546" y="60" width="170" height="44" rx="5" fill="#F2F4F7" stroke="#98A2B3" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="631" y="80" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#667085">east-west svc→svc</text>
  <text x="631" y="95" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="10" fill="#B42318">bypasses gateway</text>

  <line x1="112" y1="130" x2="138" y2="130" stroke="#5B6B7F" stroke-width="1.5" marker-end="url(#mD)"/>
  <line x1="336" y1="94" x2="374" y2="86" stroke="#5B6B7F" stroke-width="1.5" marker-end="url(#mD)"/>
  <line x1="336" y1="140" x2="374" y2="138" stroke="#5B6B7F" stroke-width="1.5" marker-end="url(#mD)"/>
  <line x1="336" y1="178" x2="374" y2="192" stroke="#B42318" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#mDx)"/>

  <text x="20" y="226" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475467">Cheapest to procure · expands PII scope of the most privileged component · cannot be shared with Kafka or file paths</text>
</svg>
