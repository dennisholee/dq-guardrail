<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 260" width="780" height="260" role="img" aria-label="Rule language options compared">
  <rect width="780" height="260" fill="#F7F9FC"/>
  <text x="20" y="26" font-family="Segoe UI,Inter,Helvetica,Arial,sans-serif" font-size="15" font-weight="600" fill="#101828">KD-2 — Where the semantic rule is evaluated</text>

  <rect x="20" y="44" width="232" height="180" rx="8" fill="#EEF7F5" stroke="#0F7B6C" stroke-width="1.8"/>
  <text x="136" y="66" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#0B5A4F">CEL — in-process (chosen)</text>
  <rect x="40" y="80" width="192" height="30" rx="4" fill="#FFFFFF" stroke="#5B6B7F"/>
  <text x="136" y="100" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1D2939">compile → costLimit → eval</text>
  <rect x="40" y="120" width="192" height="30" rx="4" fill="#FFFFFF" stroke="#5B6B7F"/>
  <text x="136" y="140" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1D2939">engine C6 (in-proc, no hop)</text>
  <rect x="40" y="160" width="192" height="30" rx="4" fill="#DCF0EA" stroke="#0F7B6C"/>
  <text x="136" y="180" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#0B5A4F">~10–50 µs · bounded</text>
  <text x="136" y="210" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#067647">score 4.55</text>

  <rect x="272" y="44" width="232" height="180" rx="8" fill="#FFFFFF" stroke="#5B6B7F" stroke-width="1.5"/>
  <text x="388" y="66" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#1D2939">OPA / Rego — side hop</text>
  <rect x="292" y="80" width="192" height="30" rx="4" fill="#FFFFFF" stroke="#5B6B7F"/>
  <text x="388" y="100" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1D2939">Envoy → ext_authz → OPA pod</text>
  <rect x="292" y="120" width="192" height="30" rx="4" fill="#FFFFFF" stroke="#5B6B7F"/>
  <text x="388" y="140" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1D2939">bundle sync + 2nd control plane</text>
  <rect x="292" y="160" width="192" height="30" rx="4" fill="#F2F4F7" stroke="#98A2B3"/>
  <text x="388" y="180" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#475467">~100s µs–ms · extra pod</text>
  <text x="388" y="210" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#B54708">score 3.65</text>

  <rect x="524" y="44" width="236" height="180" rx="8" fill="#FFFFFF" stroke="#5B6B7F" stroke-width="1.5"/>
  <text x="642" y="66" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" font-weight="600" fill="#1D2939">Custom DSL — build it</text>
  <rect x="544" y="80" width="196" height="30" rx="4" fill="#FFFFFF" stroke="#5B6B7F"/>
  <text x="642" y="100" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1D2939">own parser + evaluator + IDE</text>
  <rect x="544" y="120" width="196" height="30" rx="4" fill="#FFFFFF" stroke="#5B6B7F"/>
  <text x="642" y="140" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#1D2939">own cost model + test harness</text>
  <rect x="544" y="160" width="196" height="30" rx="4" fill="#FEF3F2" stroke="#B42318"/>
  <text x="642" y="180" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600" fill="#B42318">6–9 months, permanent</text>
  <text x="642" y="210" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="11" fill="#B42318">score 2.15</text>
</svg>
