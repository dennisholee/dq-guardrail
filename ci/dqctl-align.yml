      #     ref=$(./bin/dqctl publish \
      #       --bundle dist/dq-bundle.tar.gz \
      #       --registry ghcr.io/${{ github.repository_owner }}/dq-bundle)
      #     echo "ref=$ref" >> "$GITHUB_OUTPUT"
